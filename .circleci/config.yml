version: 2.1

jobs:
  build:
    docker:
      # Match this version to the Node.js version required by your project.
      - image: cimg/node:24.18
    working_directory: ~/project
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Build
          command: npm run build

      - run:
          name: Test
          command: npm run test --if-present

      - run:
          name: Lint
          command: npm run lint --if-present

workflows:
  nextjs-ci:
    jobs:
      - build
