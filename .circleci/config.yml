
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.18
    working_directory: ~/project
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Dependency security audit
          command: npm audit --audit-level=high

      - run:
          name: Build
          command: npm run build

      - run:
          name: Test
          command: npm run test --if-present

      - run:
          name: Lint
          command: npm run lint --if-present

  security-scan:
    docker:
      - image: semgrep/semgrep
    steps:
      - checkout
      - run:
          name: Static application security testing
          command: semgrep scan --config auto --error .

  secret-scan:
    docker:
      - image: zricethezav/gitleaks:latest
    steps:
      - checkout
      - run:
          name: Scan for leaked secrets
          command: |
            gitleaks detect \
              --source . \
              --redact \
              --verbose \
              --exit-code 1

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Trigger Render deployment
          command: 'curl --fail --show-error --request POST "$RENDER_DEPLOY_HOOK"'

workflows:
  nextjs-ci:
    jobs:
      - build
      - security-scan
      - secret-scan

      - deploy:
          requires:
            - build
            - security-scan
            - secret-scan
          filters:
            branches:
              only: main
